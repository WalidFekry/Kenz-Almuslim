apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdk 37
    defaultConfig {
        applicationId "com.kenz.almuslim"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 31
        versionName "2.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        renderscriptTargetApi 21
        renderscriptSupportModeEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        dataBinding true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.kenz.almuslim'
}

configurations.configureEach {
    exclude group: 'com.google.android.ads.consent', module: 'consent-library'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.2.0-alpha04'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.github.abenkdh:BSBottomNavigation:1.0'
    implementation 'com.github.jd-alexander:LikeButton:0.2.3'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'
    //noinspection GradleDependency
    implementation 'com.github.abenkdh:BSMob:2.3'
    implementation 'com.google.code.gson:gson:2.14.0'
    //noinspection GradleDependency
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.github.uin3566:AllAngleExpandableButton:v1.2.0'
    implementation 'com.github.amitshekhariitbhu:Fast-Android-Networking:1.0.4'
    implementation 'com.github.yalantis:ucrop:2.2.4'
    implementation 'com.github.wasabeef:recyclerview-animators:4.0.1'
    implementation 'com.github.thomper:sweet-alert-dialog:v1.4.0'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
    implementation 'io.github.florent37:shapeofview:1.4.7'
    implementation 'com.github.chrisbanes:PhotoView:2.1.4'
    implementation 'com.github.yarolegovich:SlidingRootNav:v1.1.1'
    implementation 'com.github.abenkdh:BSCarouselViewPager:1.0'
    implementation 'io.github.ParkSangGwon:tedpermission-normal:3.4.2'
    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.2'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation project(':HihiHoho')
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
    implementation 'com.github.mjn1369:prettydialog:1.0.4'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
